name: Regressão

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  regressao:
    name: regressao
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Garantir o commit de base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar o pytest e sqlite-vec
        run: python -m pip install pytest sqlite-vec

      - name: Correr a suite de regressão
        env:
          REGRESSAO_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/regressao.sh
